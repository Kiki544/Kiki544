<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="Animated figure: handwritten characters spelling HELLO, I'M KIKI are recognised one by one and decoded into text.">
  <style>
    .lbl { font: 600 11px Helvetica, Arial, sans-serif; letter-spacing: 2px; fill: #6B6F68; }
    .hand { font: italic 40px Georgia, "Times New Roman", serif; fill: #1A1D1A; stroke: #1A1D1A; stroke-width: 1;
             stroke-dasharray: 160; animation: write 0.45s ease-out both, ink .3s ease both; }
    .pred { font: 600 22px "SFMono-Regular", Consolas, monospace; fill: #D2462F; }
    .conf { font: 9px "SFMono-Regular", Consolas, monospace; fill: #6B6F68; }
    .out { font: 600 20px "SFMono-Regular", Consolas, monospace; fill: #1A1D1A; }
    .pop { animation: pop .35s cubic-bezier(.2,.75,.2,1) both; }
    .type { animation: show .01s linear both; }
    .blink { animation: blink 1s steps(1) 6.55s infinite both; }
    .scan { animation: scan 3.15s linear .6s both; }
    @keyframes write { from { stroke-dashoffset: 160; } to { stroke-dashoffset: 0; } }
    @keyframes ink { from { fill-opacity: 0; } to { fill-opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
    @keyframes show { from { opacity: 0; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes scan { from { transform: translateX(0); opacity: 1; } 99% { opacity: 1; } to { transform: translateX(660px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .scan { opacity: 0; } }
  </style>
  <rect width="880" height="330" rx="8" fill="#F3F1EA"/>

